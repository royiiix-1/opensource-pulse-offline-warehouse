name: portable-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-and-candidate-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Standard-library tests and release-scope checks
        run: python scripts/verify_portfolio.py --mode portable
      # Deliberately no cluster success badge: this job has no Hadoop/Hive/YARN services.
